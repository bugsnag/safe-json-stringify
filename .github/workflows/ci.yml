name: "unit test"

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04 # ubuntu-latest is a floating label — pinning ensures reproducible, stable builds across matrix runs
    strategy:
      matrix:
        node: [12, 14, 16, 18, 20, 22] # full matrix retained; npm@8 is compatible with all these Node versions
    steps:
      - name: Checkout PR branch # the repo must be checked out before node is configured; setup-node may read .nvmrc / package.json engines from the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Upgrade npm # pin npm@8 — supports Node >=12.13.0 and reads lockfileVersion 2/3; npm@latest requires Node >=22
        run: npm install -g npm@8

      - run: npm ci # npm ci does a clean install from package-lock.json, ensuring deterministic dependency resolution in CI
      - run: npm test